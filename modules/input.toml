# ─────────────────────────── Input (input.lua) ───────────────────────────
[input.keyboard]
layout = "ch"
variant = "fr"
repeat_rate = 100
repeat_delay = 300

[input.touchpad]
natural_scroll = true
sensitivity = 0.5

[input.mouse]
sensitivity = 0.5

[input.focus]
follows_mouse = true     # follow_mouse = 1

# hl.device("epic-mouse-v1", sensitivity = -0.5)
[[input.device]]
name = "epic-mouse-v1"
sensitivity = -0.5

# Curseur (decoration.lua bloc cursor)
[input.cursor]
theme = "volantes"
size = 48
hide_when_typing = true      # hide_on_key_press = true
hide_timeout_ms = 10000      # inactive_timeout = 10 s
follows_focus = true         # warp_on_change_workspace = 1 (approximation la plus proche)

# Le geste 3 doigts vertical = changement de workspace est natif (axe vertical
# par défaut) et ne crée jamais de workspace : l'inventaire statique ci-dessus
# remplace workspace_swipe_create_new = false.

