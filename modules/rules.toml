# ─────────────────────────── Règles de fenêtres (window_rules.lua) ───────────────────────────
# Umbriel combine toutes les règles qui matchent ; la dernière gagne sur un
# même champ. persistent_size n'existe pas (les flottants gardent leur taille
# d'eux-mêmes) ; suppress_event = "maximize" est couvert par
# honor_restored_maximize = false ; l'idle-inhibit n'est PAS configurable par
# règle (protocole wayland idle-inhibit, à la charge de l'application).

# Taille par défaut de TOUS les flottants (l'équivalent du mod+F d'Hyprland) :
# Umbriel mémorise la règle et l'applique au premier passage en flottant, y
# compris quand il vient de window-toggle-floating (Mod+F). En premier du
# fichier car la dernière règle qui set un champ gagne : chaque règle par-app
# plus bas garde sa propre taille. is_dialog=false évite d'imposer 860x530 aux
# dialogues (message, préférences) qui se dimensionnent eux-mêmes.

[[window_rule]]
match.is_dialog = false
default_floating_size_px = { width = 860, height = 530 }
 
[[window_rule]]
match.app_id = '^Dialog$'
default_floating = true
default_position = { x = 0, y = 0 }
default_floating_size_px = { width = 308, height = 102 }   # taille naturelle des boîtes de question
default_pinned = true

[[window_rule]]
# opacity = 0.85
# blur = true
# blur_optimized = true
# blur_ignore_alpha = 0.1
# blur_popups = false

# Réglages Noctalia (ton flottant 1080x920 — couvre aussi l'app-id ".Settings")
[[window_rule]]
match.app_id = '^dev\.noctalia\.Noctalia'
default_floating = true
default_floating_size_px = { width = 980, height = 500 }

# Paramètres Noctalia (même app-id que le shell) : tuilé, pas flottant.
[[window_rule]]
match.app_id = '^dev\.noctalia\.Noctalia$'
match.title = '^Paramètres Noctalia$'
default_floating = false

# Partage d'écran Noctalia (règle du config packagé)
[[window_rule]]
match.app_id = '^dev\.noctalia\.UmbrielSharePicker$'
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

# Picture-in-Picture des navigateurs (règle du config packagé)
[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

# Satty (annotation de capture) — flottant, centré, 1920x1080, sans animation
# (la désactivation d'animation par fenêtre n'existe pas dans Umbriel)
[[window_rule]]
match.app_id = '^com\.gabm\.satty$'
default_floating = true
default_position = { x = 0, y = 0 }
default_floating_size_px = { width = 1920, height = 1080 }

